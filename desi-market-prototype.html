<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Desi Market — हर गाँव की डिजिटल दुकान</title>
<style>
  @font-face{font-family:'system';src:local('Arial');}
  :root{
    --sand:#F7EFDE;
    --sand-deep:#EFE3C6;
    --paper:#FFFCF5;
    --indigo:#22375B;
    --indigo-2:#2E4B7A;
    --marigold:#E7A234;
    --marigold-deep:#C8811C;
    --leaf:#4B7A54;
    --brick:#B8452F;
    --ink:#2B2418;
    --ink-soft:#6B6252;
    --line:#E2D5B4;
    --white:#FFFFFF;
    --radius-s:10px;
    --radius-m:16px;
    --radius-l:26px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:'Segoe UI','Noto Sans','Mangal','Arial Unicode MS',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.head-font{
    font-family:'Segoe UI','Noto Sans',Arial,sans-serif;
  }
  #root{max-width:480px;margin:0 auto;min-height:100vh;background:var(--sand);position:relative;box-shadow:0 0 40px rgba(34,55,91,0.08);}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::-webkit-scrollbar{display:none;}

  /* ---------- Top bar ---------- */
  .topbar{
    background:linear-gradient(135deg, var(--indigo) 0%, var(--indigo-2) 100%);
    color:var(--white);
    padding:18px 18px 46px 18px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;
    right:-30px; top:-30px;
    width:140px;height:140px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(231,162,52,0.35) 0%, rgba(231,162,52,0) 70%);
  }
  .brandrow{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:38px;height:38px;border-radius:11px;
    background:var(--marigold);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:var(--indigo);font-size:18px;
    flex-shrink:0;
  }
  .brand-name{font-size:19px;font-weight:700;line-height:1.1;}
  .brand-tag{font-size:11px;opacity:0.75;margin-top:2px;}
  .loc-pill{
    display:flex;align-items:center;gap:5px;
    background:rgba(255,255,255,0.14);
    padding:6px 12px;border-radius:100px;
    font-size:12.5px;white-space:nowrap;
  }
  .search-wrap{position:relative;z-index:1;margin-top:16px;}
  .search-box{
    width:100%;
    background:var(--paper);
    border:none;border-radius:100px;
    padding:14px 18px 14px 44px;
    font-size:14.5px;color:var(--ink);
    outline:none;
  }
  .search-box::placeholder{color:var(--ink-soft);}
  .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;}

  .quick-row{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:-28px 14px 0 14px;
    position:relative;z-index:2;
  }
  .quick-item{
    background:var(--paper);
    border-radius:var(--radius-m);
    padding:12px 6px 10px;
    text-align:center;
    box-shadow:0 6px 16px rgba(34,55,91,0.10);
    border:none;
  }
  .quick-item .qi-emoji{font-size:20px;display:block;margin-bottom:4px;}
  .quick-item .qi-label{font-size:11px;font-weight:600;color:var(--indigo);}

  /* ---------- generic page ---------- */
  .page{padding:20px 16px 96px 16px;}
  .section-title{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:22px 0 12px 0;
  }
  .section-title h2{font-size:16.5px;margin:0;color:var(--indigo);}
  .section-title .see-all{font-size:12px;color:var(--marigold-deep);font-weight:600;border:none;background:none;}

  .chip-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
  .chip{
    flex:0 0 auto;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:100px;
    padding:8px 15px;
    font-size:12.5px;font-weight:600;color:var(--indigo);
  }
  .chip.active{background:var(--indigo);color:var(--white);border-color:var(--indigo);}

  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .cat-card{
    background:var(--white);border-radius:var(--radius-m);
    padding:12px 4px;text-align:center;border:1px solid var(--line);
  }
  .cat-card .cat-emoji{font-size:22px;display:block;margin-bottom:6px;}
  .cat-card .cat-label{font-size:10.5px;font-weight:600;color:var(--ink);line-height:1.2;}

  .h-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;}
  .card{
    background:var(--white);
    border-radius:var(--radius-m);
    overflow:hidden;
    border:1px solid var(--line);
  }
  .card-accent{height:5px;width:100%;}
  .acc-product{background:var(--marigold);}
  .acc-service{background:var(--indigo-2);}
  .acc-worker{background:var(--leaf);}

  .product-card{width:132px;flex:0 0 auto;}
  .product-thumb{
    height:84px;background:var(--sand-deep);
    display:flex;align-items:center;justify-content:center;font-size:30px;
  }
  .card-body{padding:9px 10px 12px;}
  .p-name{font-size:12.5px;font-weight:600;line-height:1.25;margin:0 0 4px;}
  .p-shop{font-size:10.5px;color:var(--ink-soft);margin:0 0 6px;}
  .p-price-row{display:flex;align-items:center;justify-content:space-between;}
  .p-price{font-size:13px;font-weight:700;color:var(--indigo);}
  .p-unit{font-size:10px;color:var(--ink-soft);}
  .add-btn{
    background:var(--marigold);color:var(--indigo);border:none;
    border-radius:8px;font-size:11px;font-weight:700;padding:5px 9px;
  }

  .shop-card{width:190px;flex:0 0 auto;}
  .shop-thumb{
    height:70px;background:linear-gradient(120deg,var(--marigold) 0%, var(--marigold-deep) 100%);
    display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--white);
  }
  .shop-name{font-size:13px;font-weight:700;margin:0 0 3px;}
  .shop-meta{font-size:10.5px;color:var(--ink-soft);margin:0;}
  .rating-badge{
    display:inline-flex;align-items:center;gap:3px;
    background:#FCF1DA;color:var(--marigold-deep);
    font-size:10.5px;font-weight:700;
    padding:2px 7px;border-radius:100px;margin-top:6px;
  }

  .worker-card{width:220px;flex:0 0 auto;}
  .worker-top{display:flex;gap:10px;padding:12px 12px 0;}
  .worker-avatar{
    width:46px;height:46px;border-radius:50%;
    background:var(--indigo);color:var(--white);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:16px;flex-shrink:0;
  }
  .worker-name{font-size:13px;font-weight:700;margin:0;}
  .worker-skill{font-size:11px;color:var(--ink-soft);margin:2px 0 0;}
  .avail-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;}
  .avail-green{background:var(--leaf);}
  .avail-yellow{background:var(--marigold);}
  .avail-red{background:var(--brick);}
  .worker-foot{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px 12px;font-size:11px;
  }
  .worker-rate{font-weight:700;color:var(--indigo);font-size:12.5px;}

  .verified-tag{
    display:inline-flex;align-items:center;gap:3px;
    font-size:9.5px;font-weight:700;color:var(--leaf);
    background:#EAF3EB;padding:2px 6px;border-radius:100px;
  }

  .join-banner{
    margin-top:24px;
    background:linear-gradient(120deg, var(--leaf) 0%, #3C6644 100%);
    border-radius:var(--radius-l);
    padding:20px 18px;color:var(--white);
    position:relative;overflow:hidden;
  }
  .join-banner::after{
    content:"🤝";position:absolute;right:14px;bottom:8px;font-size:52px;opacity:0.18;
  }
  .join-banner h3{margin:0 0 6px;font-size:16px;}
  .join-banner p{margin:0 0 12px;font-size:12px;opacity:0.9;max-width:220px;}
  .join-btn{
    background:var(--white);color:var(--leaf);border:none;
    border-radius:100px;padding:9px 18px;font-size:12.5px;font-weight:700;
  }

  .bottom-nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;
    background:var(--paper);
    border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(5,1fr);
    padding:8px 4px 10px;z-index:20;
  }
  .nav-item{background:none;border:none;text-align:center;color:var(--ink-soft);}
  .nav-item .nav-emoji{font-size:18px;display:block;}
  .nav-item .nav-label{font-size:9.5px;margin-top:2px;display:block;font-weight:600;}
  .nav-item.active{color:var(--indigo);}
  .cart-badge{position:relative;}
  .cart-count{
    position:absolute;top:-4px;right:16px;
    background:var(--brick);color:white;font-size:9px;font-weight:700;
    width:15px;height:15px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }

  .inner-head{
    display:flex;align-items:center;gap:10px;
    padding:16px 16px 12px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:10;
  }
  .back-btn{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
    background:var(--white);font-size:16px;flex-shrink:0;
  }
  .inner-title{font-size:15.5px;font-weight:700;color:var(--indigo);margin:0;}
  .inner-sub{font-size:11px;color:var(--ink-soft);margin:1px 0 0;}

  .search-field{
    display:flex;align-items:center;gap:8px;
    background:var(--white);border:1px solid var(--line);
    border-radius:100px;padding:10px 14px;margin:14px 16px 0;
  }
  .search-field input{border:none;outline:none;flex:1;font-size:13.5px;background:none;color:var(--ink);}

  .list-col{display:flex;flex-direction:column;gap:12px;padding:14px 16px 90px;}
  .full-card{display:flex;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius-m);padding:12px;}
  .full-card .thumb{width:58px;height:58px;border-radius:12px;background:var(--sand-deep);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
  .full-card .info{flex:1;min-width:0;}
  .full-card h4{margin:0 0 3px;font-size:13.5px;}
  .full-card p{margin:0;font-size:11px;color:var(--ink-soft);}
  .full-card .right-col{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;}

  .segment{display:flex;background:var(--sand-deep);border-radius:100px;padding:4px;margin:14px 16px 0;}
  .segment button{flex:1;border:none;background:none;padding:8px 0;border-radius:100px;font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .segment button.active{background:var(--indigo);color:var(--white);}

  .pd-hero{height:220px;background:linear-gradient(160deg,var(--sand-deep),var(--sand));display:flex;align-items:center;justify-content:center;font-size:64px;}
  .pd-body{padding:18px 16px 110px;}
  .pd-title{font-size:19px;margin:0 0 4px;}
  .pd-shop-link{font-size:12.5px;color:var(--marigold-deep);font-weight:600;margin:0 0 12px;cursor:pointer;}
  .pd-price{font-size:23px;font-weight:800;color:var(--indigo);}
  .pd-unit{font-size:12px;color:var(--ink-soft);margin-left:4px;}
  .stepper{display:flex;align-items:center;gap:14px;background:var(--sand-deep);border-radius:100px;padding:6px 8px;}
  .stepper button{width:28px;height:28px;border-radius:50%;border:none;background:var(--white);font-size:16px;font-weight:700;color:var(--indigo);}
  .divider{height:1px;background:var(--line);margin:18px 0;}
  .fixed-cta{
    position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;padding:12px 16px;
    background:var(--paper);border-top:1px solid var(--line);
    display:flex;gap:10px;z-index:15;
  }
  .btn-primary{
    flex:1;background:var(--indigo);color:var(--white);border:none;
    border-radius:100px;padding:13px;font-size:13.5px;font-weight:700;
  }
  .btn-outline{
    background:var(--white);color:var(--indigo);border:1.5px solid var(--indigo);
    border-radius:100px;padding:13px 18px;font-size:13.5px;font-weight:700;
  }
  .btn-secondary{
    flex:1;background:var(--marigold);color:var(--indigo);border:none;
    border-radius:100px;padding:13px;font-size:13.5px;font-weight:700;
  }

  .wp-head{
    background:linear-gradient(135deg,var(--indigo),var(--indigo-2));
    color:var(--white);padding:24px 16px 30px;text-align:center;
  }
  .wp-avatar{
    width:76px;height:76px;border-radius:50%;background:var(--marigold);
    color:var(--indigo);display:flex;align-items:center;justify-content:center;
    font-size:28px;font-weight:800;margin:0 auto 10px;border:3px solid rgba(255,255,255,0.5);
  }
  .wp-name{font-size:18px;margin:0 0 2px;}
  .wp-skill{font-size:12.5px;opacity:0.85;margin:0;}
  .stat-row{display:flex;justify-content:space-around;background:var(--white);margin:-18px 16px 0;border-radius:var(--radius-m);padding:14px 6px;border:1px solid var(--line);position:relative;z-index:2;}
  .stat-item{text-align:center;}
  .stat-val{font-size:15px;font-weight:800;color:var(--indigo);display:block;}
  .stat-lab{font-size:10px;color:var(--ink-soft);}
  .info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
  .info-row .lab{color:var(--ink-soft);}
  .info-row .val{font-weight:600;}
  .gallery-row{display:flex;gap:8px;overflow-x:auto;}
  .gallery-thumb{width:80px;height:64px;border-radius:10px;background:var(--sand-deep);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .review-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .review-card .rname{font-size:12px;font-weight:700;}
  .review-card .rtext{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(34,26,15,0.5);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-sheet{
    background:var(--paper);width:100%;max-width:480px;
    border-radius:26px 26px 0 0;
    padding:8px 18px 26px;
    max-height:88vh;overflow-y:auto;
  }
  .sheet-handle{width:38px;height:4px;background:var(--line);border-radius:100px;margin:6px auto 14px;}
  .modal-title{font-size:16px;margin:0 0 2px;color:var(--indigo);}
  .modal-sub{font-size:12px;color:var(--ink-soft);margin:0 0 16px;}
  .step-dots{display:flex;gap:6px;margin-bottom:16px;}
  .step-dot{flex:1;height:4px;border-radius:100px;background:var(--line);}
  .step-dot.done{background:var(--marigold);}
  .field-label{font-size:12px;font-weight:700;color:var(--indigo);margin:14px 0 6px;display:block;}
  .field-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;background:var(--white);outline:none;}
  .field-textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;background:var(--white);outline:none;min-height:80px;resize:vertical;}
  .slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .slot-btn{border:1px solid var(--line);background:var(--white);border-radius:10px;padding:9px 4px;font-size:12px;font-weight:600;color:var(--ink);}
  .slot-btn.active{background:var(--indigo);color:var(--white);border-color:var(--indigo);}
  .upload-box{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;font-size:12px;color:var(--ink-soft);background:var(--white);display:block;}
  .quote-row{display:flex;justify-content:space-between;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .success-box{text-align:center;padding:20px 6px;}
  .success-emoji{font-size:52px;margin-bottom:10px;}

  .toast{
    position:fixed;bottom:130px;left:50%;transform:translateX(-50%);
    background:var(--indigo);color:var(--white);
    padding:10px 20px;border-radius:100px;font-size:12.5px;font-weight:600;
    z-index:60;box-shadow:0 8px 20px rgba(0,0,0,0.2);
  }

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty-state .ee{font-size:40px;margin-bottom:10px;}
</style>
</head>
<body>
<div id="root"></div>

/* ---------- HELPERS ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function findCat(list, id){ for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; } return null; }
function catLabel(list, id){ var c=findCat(list,id); return c ? c.label : id; }
function shopById(id){ for(var i=0;i<SHOPS.length;i++){ if(SHOPS[i].id===id) return SHOPS[i]; } return null; }
function productById(id){ for(var i=0;i<PRODUCTS.length;i++){ if(PRODUCTS[i].id===id) return PRODUCTS[i]; } return null; }
function workerById(id){ for(var i=0;i<WORKERS.length;i++){ if(WORKERS[i].id===id) return WORKERS[i]; } return null; }
function availInfo(a){
  if(a==="green") return {text:"उपलब्ध", cls:"avail-green"};
  if(a==="yellow") return {text:"व्यस्त", cls:"avail-yellow"};
  return {text:"अनुपलब्ध", cls:"avail-red"};
}
function stars(rating){ return '<span class="rating-badge">⭐ '+rating.toFixed(1)+'</span>'; }

var root = document.getElementById("root");

function go(screen, params){
  state.screen = screen;
  state.params = params || {};
  if(screen === "product_detail"){ state.pdQty = 1; }
  if(screen === "join"){ state.joinSelectedRole = null; state.joinSent = false; }
  if(screen === "search"){ state.searchQuery = ""; }
  render();
  window.scrollTo(0,0);
}

function showToast(msg){
  state.toast = msg;
  render();
  if(state.toastTimer) clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(function(){ state.toast = null; render(); }, 1600);
}

function addToCart(productId, qty){
  qty = qty || 1;
  var found = null;
  for(var i=0;i<state.cart.length;i++){ if(state.cart[i].productId===productId){ found = state.cart[i]; break; } }
  if(found){ found.qty += qty; } else { state.cart.push({productId:productId, qty:qty}); }
  showToast("कार्ट में जोड़ा गया ✅");
}

function cartCount(){
  var c = 0;
  for(var i=0;i<state.cart.length;i++){ c += state.cart[i].qty; }
  return c;
}

/* ---------- MAIN RENDER ---------- */
function screenHTML(){
  switch(state.screen){
    case "home": return homeScreenHTML();
    case "search": return searchScreenHTML();
    case "categories_products": return categoriesScreenHTML("products");
    case "categories_services": return categoriesScreenHTML("services");
    case "product_list": return productListScreenHTML(state.params.cat || null);
    case "worker_list": return workerListScreenHTML(state.params.cat || null);
    case "shops": return shopListScreenHTML();
    case "shop_detail": return shopDetailScreenHTML(state.params.id);
    case "product_detail": return productDetailScreenHTML(state.params.id);
    case "worker_profile": return workerProfileScreenHTML(state.params.id);
    case "cart": return cartScreenHTML();
    case "join": return joinScreenHTML();
    case "profile": return profileScreenHTML();
    case "success": return checkoutSuccessScreenHTML();
    default: return homeScreenHTML();
  }
}

function render(){
  var html = screenHTML();
  if(state.screen !== "success"){ html += bottomNavHTML(); }
  html += bookingModalHTML();
  if(state.toast){ html += '<div class="toast">'+esc(state.toast)+'</div>'; }
  root.innerHTML = html;
}

/* ---------- EVENT DELEGATION ---------- */
root.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  if(el.getAttribute("data-stop")) e.stopPropagation();
  var action = el.getAttribute("data-action");

  switch(action){
    case "go":
      go(el.getAttribute("data-screen"));
      break;
    case "open-product":
      go("product_detail", {id: el.getAttribute("data-id")});
      break;
    case "open-shop":
      go("shop_detail", {id: el.getAttribute("data-id")});
      break;
    case "open-worker":
      go("worker_profile", {id: el.getAttribute("data-id")});
      break;
    case "open-product-list":
      go("product_list", {cat: el.getAttribute("data-cat") || null});
      break;
    case "open-worker-list":
      go("worker_list", {cat: el.getAttribute("data-cat") || null});
      break;
    case "add-cart":
      addToCart(el.getAttribute("data-id"), 1);
      break;
    case "add-cart-qty":
      addToCart(el.getAttribute("data-id"), state.pdQty);
      go("home");
      break;
    case "pd-qty":
      state.pdQty = Math.max(1, state.pdQty + parseInt(el.getAttribute("data-delta"),10));
      render();
      break;
    case "cart-qty": {
      var idx = parseInt(el.getAttribute("data-index"),10);
      var delta = parseInt(el.getAttribute("data-delta"),10);
      state.cart[idx].qty = Math.max(1, state.cart[idx].qty + delta);
      render();
      break;
    }
    case "checkout-order":
      state.cart = [];
      state.checkoutInfo = {kind:"order"};
      go("success");
      break;
    case "set-query":
      state.searchQuery = el.getAttribute("data-text");
      render();
      break;
    case "book-open":
      state.bookingWorkerId = el.getAttribute("data-id");
      state.bookingStep = 1;
      state.bookingDate = "आज";
      state.bookingSlot = null;
      state.bookingProblem = "";
      state.bookingPhotoName = null;
      render();
      break;
    case "book-close-overlay":
      if(e.target === el){ state.bookingWorkerId = null; render(); }
      break;
    case "book-step":
      state.bookingStep = parseInt(el.getAttribute("data-step"),10);
      render();
      break;
    case "book-set-date":
      state.bookingDate = el.getAttribute("data-date");
      render();
      break;
    case "book-set-slot":
      state.bookingSlot = el.getAttribute("data-slot");
      render();
      break;
    case "book-confirm": {
      var wid = state.bookingWorkerId;
      state.bookingWorkerId = null;
      state.checkoutInfo = {kind:"booking", workerId: wid};
      go("success");
      break;
    }
    case "join-select-role":
      state.joinSelectedRole = el.getAttribute("data-role");
      render();
      break;
    case "join-send-otp":
      state.joinSent = true;
      render();
      break;
    default:
      break;
  }
});

root.addEventListener("input", function(e){
  var t = e.target;
  if(t.id === "searchInputEl"){
    state.searchQuery = t.value;
    var resultsEl = document.getElementById("searchResultsEl");
    if(resultsEl) resultsEl.innerHTML = searchResultsInnerHTML();
    return;
  }
  var bind = t.getAttribute && t.getAttribute("data-bind");
  if(bind){ state[bind] = t.value; }
});

root.addEventListener("change", function(e){
  var el = e.target.closest('[data-action="book-photo"]');
  if(el && el.files && el.files[0]){
    state.bookingPhotoName = el.files[0].name;
    render();
  }
});

/* ---------- BOOT ---------- */
render();
</script>
</body>
</html>
